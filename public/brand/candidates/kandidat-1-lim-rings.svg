<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="limRed1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3823" />
      <stop offset="35%" stop-color="#C80002" />
      <stop offset="80%" stop-color="#880001" />
      <stop offset="100%" stop-color="#5E0000" />
    </linearGradient>
    <linearGradient id="limRedSoft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5A36" />
      <stop offset="50%" stop-color="#D91102" />
      <stop offset="100%" stop-color="#910001" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE1A2" />
      <stop offset="50%" stop-color="#CFA14B" />
      <stop offset="100%" stop-color="#936D27" />
    </linearGradient>
    <filter id="shadowRed1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#4A0000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark charcoal pill tile background for ultimate contrast in tab favicon -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#1C1816" stroke="#332B26" stroke-width="1.5" />

  <!-- Overlapping Signature Lingkar Rings with RSVP checkmark -->
  <g filter="url(#shadowRed1)">
    <!-- Primary Lingkar Ring (Left) -->
    <path d="M 44 26 C 30.7 26 20 36.7 20 50 C 20 63.3 30.7 74 44 74 C 54.2 74 62.9 67.6 66.2 58.5 C 62.6 62.5 57.3 65 51.5 65 C 40.5 65 31.5 56 31.5 45 C 31.5 36.8 36.5 29.8 43.6 26.8 C 43.7 26.5 43.9 26.2 44 26 Z" fill="url(#limRed1)" />

    <!-- Secondary Intersecting Lingkar Ring (Right) -->
    <path d="M 56 26 C 69.3 26 80 36.7 80 50 C 80 63.3 69.3 74 56 74 C 45.8 74 37.1 67.6 33.8 58.5 C 37.4 62.5 42.7 65 48.5 65 C 59.5 65 68.5 56 68.5 45 C 68.5 36.8 63.5 29.8 56.4 26.8 C 56.3 26.5 56.1 26.2 56 26 Z" fill="url(#limRedSoft)" />

    <!-- Central RSVP Gold Checkmark Accent -->
    <path d="M 42 50 L 48 56 L 60 42" fill="none" stroke="url(#goldAccent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

