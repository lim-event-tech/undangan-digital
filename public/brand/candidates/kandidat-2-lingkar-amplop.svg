  </defs>

  <!-- Background tile -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#FAF7F0" stroke="#E4DAC7" stroke-width="1.5" />

  <!-- Outer geometric loop (Letter + Circle) -->
