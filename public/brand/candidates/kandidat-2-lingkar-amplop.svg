<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gold2A" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DE9F" />
      <stop offset="40%" stop-color="#CA9C4D" />
      <stop offset="100%" stop-color="#7B561B" />
    </linearGradient>
    <linearGradient id="gold2B" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5C178" />
      <stop offset="50%" stop-color="#A57A2E" />
      <stop offset="100%" stop-color="#604212" />
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.2" />
