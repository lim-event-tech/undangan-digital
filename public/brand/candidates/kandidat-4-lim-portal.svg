<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="limRed4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5238" />
      <stop offset="45%" stop-color="#C50002" />
      <stop offset="100%" stop-color="#700001" />
    </linearGradient>
    <linearGradient id="gold4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B4E" />
      <stop offset="50%" stop-color="#FFF2D1" />
      <stop offset="100%" stop-color="#C59B4E" />
