  </defs>

  <!-- Dark charcoal squircle container -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#201C19" stroke="#362E29" stroke-width="1.5" />

  <!-- Double Arch Portal in LIM Red -->
  <path d="M 28 74 L 28 44 C 28 31.85 37.85 22 50 22 C 62.15 22 72 31.85 72 44 L 72 74" fill="none" stroke="url(#limRed4)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Inner Invitation Envelope fold in Gold -->
