  <line x1="28" y1="74" x2="72" y2="74" stroke="url(#limRed4)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Sparkle star at apex of portal -->
  <path d="M 50 12 Q 50 19 43 19 Q 50 19 50 26 Q 50 19 57 19 Q 50 19 50 12 Z" fill="url(#gold4)" />
</svg>

