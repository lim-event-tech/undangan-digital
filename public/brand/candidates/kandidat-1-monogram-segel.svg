<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED596" />
      <stop offset="35%" stop-color="#C59B4E" />
      <stop offset="70%" stop-color="#936D28" />
      <stop offset="100%" stop-color="#6F4F19" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B88E3E" />
      <stop offset="50%" stop-color="#FDF0CD" />
      <stop offset="100%" stop-color="#B88E3E" />
    </linearGradient>
    <filter id="softGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#553A0F" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Seal with subtle luxury rim -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#201C18" filter="url(#softGlow1)" />
  <rect x="8" y="8" width="84" height="84" rx="22" fill="none" stroke="url(#goldGrad1)" stroke-width="1.5" stroke-opacity="0.8" />
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#goldLight)" stroke-width="0.75" stroke-dasharray="2 3" stroke-opacity="0.5" />

  <!-- Monogram U / Envelope Wing -->
  <!-- Left stem of U -->
  <path d="M 32 30 C 32 30 36 30 36 34 L 36 54 C 36 64 42 71 50 71 C 58 71 64 64 64 54 L 64 34 C 64 30 68 30 68 30 C 68 30 68 36 68 54 C 68 67 59 76 50 76 C 41 76 32 67 32 54 Z" fill="url(#goldGrad1)" />

  <!-- Envelope fold accent intersecting center -->
  <path d="M 36 38 L 50 49 L 64 38" fill="none" stroke="url(#goldLight)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 4-point golden star on top -->
  <path d="M 50 21 Q 50 27 45 27 Q 50 27 50 33 Q 50 27 55 27 Q 50 27 50 21 Z" fill="url(#goldLight)" />
</svg>

