name: lim-rsvp

services:
  db:
    image: postgres:17-alpine
    container_name: lim-rsvp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-undangan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-undangan_dev}
      POSTGRES_DB: ${POSTGRES_DB:-undangan_digital}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - lim-rsvp-db-data:/var/lib/postgresql/data
    networks:
      - lim-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: lim-rsvp-app
    container_name: lim-rsvp-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-undangan}:${POSTGRES_PASSWORD:-undangan_dev}@db:5432/${POSTGRES_DB:-undangan_digital}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    networks:
      - lim-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/masuk || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  lim-rsvp-db-data:

networks:
  lim-network:
    driver: bridge
