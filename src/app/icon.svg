  <!-- Deep charcoal badge -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#181513" stroke="#2E2824" stroke-width="1.5" />

  <!-- Diagonal interconnected rings forming L and stylized M / Envelope -->
